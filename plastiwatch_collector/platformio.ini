; =============================================================================
; PlastiWatch Data Collector — PlatformIO Project Configuration
;
; Target : Seeed Studio XIAO ESP32C3
; Purpose: Wireless IMU data collection from MPU6050, uploaded to Edge Impulse
; =============================================================================

[platformio]
description = PlastiWatch wireless IMU data collector for Edge Impulse training

; ---------------------------------------------------------------------------
; Common build settings shared across all environments
; ---------------------------------------------------------------------------
[common]
platform      = espressif32
framework     = arduino
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    colorize
    time
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -std=gnu++17
build_unflags =
    -std=gnu++11
lib_deps =
    bblanchon/ArduinoJson@^7.3.0
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9

; ---------------------------------------------------------------------------
; Default environment — XIAO ESP32C3
; ---------------------------------------------------------------------------
[env:seeed_xiao_esp32c3]
extends       = common
board         = seeed_xiao_esp32c3
upload_speed  = 921600
board_build.flash_mode = dio

; ---------------------------------------------------------------------------
; Debug environment — verbose logging enabled
; ---------------------------------------------------------------------------
[env:seeed_xiao_esp32c3_debug]
extends       = common
board         = seeed_xiao_esp32c3
build_flags   =
    ${common.build_flags}
    -DCORE_DEBUG_LEVEL=3
    -DPLASTIWATCH_DEBUG=1
